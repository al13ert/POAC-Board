<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Point of AC · Office Command Centre</title><link rel="stylesheet" href="style.css"></head><body>
<main id="screen">
<header><div class="brand"><img src="assets/master-logo.png" alt="Point of AC"></div><div class="heading"><p class="eyebrow">OUR PEOPLE. OUR PROJECTS. OUR NEXT CHAPTER.</p><h1>Office Command Centre<span class="spark">✳</span></h1><p id="date"></p></div><div class="weather"><span id="weather">Hong Kong · —</span><small id="weather-status">DEMO</small><b id="clock"></b></div></header>
<div class="main-grid"><section class="calendar panel"><div class="section-head"><h2>This week</h2><span id="week"></span><small id="calendar-status"></small></div><div id="calendar"></div><div id="calendar-page" class="pagination"></div></section>
<section class="tasks panel dark"><div class="section-head"><h2>Make it happen</h2><small id="tasks-status"></small></div><div id="tasks"></div><div id="tasks-page" class="pagination"></div></section>
<section class="lower"><div class="panel notices"><div class="section-head"><h2>On our radar</h2><small id="announcements-status"></small></div><div id="announcements"></div></div><div class="panel milestones"><div class="section-head"><h2>Next milestones</h2><small id="milestones-status"></small></div><div id="milestones"></div></div></section>
<section class="news panel"><div class="section-head"><h2>The outside world</h2><small id="news-status"></small></div><div id="news"></div><div class="sources">SCMP · BBC · Reuters · CNBC · Bloomberg</div></section></div>
<section class="market"><div><h2>Market watch</h2><small id="markets-status"></small></div><div id="markets"></div></section>
<footer><span id="connection">DEMO MODE · Sample business data</span><span id="world"></span><div><button id="demo">View demo</button><button id="fullscreen">Full screen</button></div></footer>
</main><script type="module" src="app.js"></script></body></html>
